services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tickets
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: tickets
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://tickets:${DB_PASSWORD}@db:5432/tickets
    depends_on:
      - db

volumes:
  pgdata: